<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anik Racing Online</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

.game {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: #16823a;
}

.road {
    position: absolute;
    width: 80%;
    max-width: 500px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #444;
    border-left: 8px solid white;
    border-right: 8px solid white;
    overflow: hidden;
}

.lane {
    position: absolute;
    width: 8px;
    height: 100px;
    background: white;
    left: 50%;
    transform: translateX(-50%);
    animation: roadMove 0.6s linear infinite;
}

.lane:nth-child(1) {
    top: -120px;
}

.lane:nth-child(2) {
    top: 250px;
    animation-delay: .2s;
}

.lane:nth-child(3) {
    top: 620px;
    animation-delay: .4s;
}

@keyframes roadMove {
    from {
        transform: translate(-50%, -150px);
    }

    to {
        transform: translate(-50%, 110vh);
    }
}

.car {
    position: absolute;
    width: 55px;
    height: 95px;
    border-radius: 12px;
    border: 4px solid white;
}

.player {
    background: red;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
}

.enemy {
    background: blue;
    top: -120px;
    left: 30%;
}

.window {
    position: absolute;
    width: 35px;
    height: 25px;
    background: #111;
    top: 10px;
    left: 6px;
    border-radius: 5px;
}

.info {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    color: white;
    z-index: 10;
}

.info h2 {
    margin: 5px;
}

.score {
    font-size: 18px;
}

.controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 40px;
    z-index: 20;
}

button {
    width: 80px;
    height: 55px;
    border: none;
    border-radius: 15px;
    font-size: 25px;
}

.gameOver {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.75);
    color: white;
    z-index: 30;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.gameOver button {
    font-size: 18px;
    width: 140px;
}
</style>
</head>

<body>

<div class="game">

    <div class="info">
        <h2>🏎️ Anik Racing Online</h2>
        <div class="score">
            Score: <span id="score">0</span>
        </div>
    </div>

    <div class="road">

        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>

        <div class="car player" id="player">
            <div class="window"></div>
        </div>

        <div class="car enemy" id="enemy">
            <div class="window"></div>
        </div>

    </div>

    <div class="controls">
        <button onclick="moveLeft()">⬅️</button>
        <button onclick="moveRight()">➡️</button>
    </div>

    <div class="gameOver" id="gameOver">
        <h1>💥 GAME OVER</h1>
        <p>Your Score: <span id="finalScore">0</span></p>
        <button onclick="location.reload()">RESTART</button>
    </div>

</div>

<script>

const player = document.getElementById("player");
const enemy = document.getElementById("enemy");

const scoreText = document.getElementById("score");
const finalScore = document.getElementById("finalScore");
const gameOver = document.getElementById("gameOver");

let playerPosition = 50;
let enemyTop = -120;
let enemyPosition = 30;

let score = 0;
let gameRunning = true;

function moveLeft() {

    if (!gameRunning) return;

    playerPosition -= 8;

    if (playerPosition < 12) {
        playerPosition = 12;
    }

    player.style.left = playerPosition + "%";
}

function moveRight() {

    if (!gameRunning) return;

    playerPosition += 8;

    if (playerPosition > 88) {
        playerPosition = 88;
    }

    player.style.left = playerPosition + "%";
}

function moveEnemy() {

    if (!gameRunning) return;

    enemyTop += 6;

    enemy.style.top = enemyTop + "px";

    if (enemyTop > window.innerHeight) {

        enemyTop = -120;

        enemyPosition = Math.random() * 70 + 15;

        enemy.style.left = enemyPosition + "%";

        score++;

        scoreText.textContent = score;
    }

    checkCollision();
}

function checkCollision() {

    const playerRect = player.getBoundingClientRect();
    const enemyRect = enemy.getBoundingClientRect();

    if (
        playerRect.left < enemyRect.right &&
        playerRect.right > enemyRect.left &&
        playerRect.top < enemyRect.bottom &&
        playerRect.bottom > enemyRect.top
    ) {

        gameRunning = false;

        finalScore.textContent = score;

        gameOver.style.display = "flex";
    }
}

setInterval(moveEnemy, 30);

</script>

</body>
</html>
